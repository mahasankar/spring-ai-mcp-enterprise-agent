# Server Port Configuration
server.port=8081

# Application Name
spring.application.name=spring-ai-mcp-database-server

# Spring AI MCP Server Properties
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=spring-ai-mcp-database-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.instructions=Secure enterprise database worker server exposing customer lookup and refund tools.
spring.ai.mcp.server.sse-message-endpoint=/mcp/messages

# Capabilities
spring.ai.mcp.server.capabilities.tool=true
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false