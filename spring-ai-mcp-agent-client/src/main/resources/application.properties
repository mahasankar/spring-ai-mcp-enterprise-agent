server.port=8080

spring.application.name=spring-ai-mcp-agent-client

# Groq Configuration (Using Spring AI OpenAI compatibility layer)
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.base-url=https://api.groq.com/openai
spring.ai.openai.chat.completions-path=/v1/chat/completions
spring.ai.openai.chat.options.model=openai/gpt-oss-20b

# MCP Client Configuration
spring.ai.mcp.client.enabled=true
spring.ai.mcp.client.name=spring-ai-mcp-agent-client
spring.ai.mcp.client.version=1.0.0
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.toolcallback.enabled=true
	
# Remote Server Connection over SSE
spring.ai.mcp.client.sse.connections.database-server.url=http://localhost:8081

# ============================
# Resilience4j Configuration 
# ============================

# Retry Configuration
resilience4j.retry.instances.enterpriseAgentService.max-attempts=3
resilience4j.retry.instances.enterpriseAgentService.wait-duration=2s
resilience4j.retry.instances.enterpriseAgentService.enable-exponential-backoff=true
resilience4j.retry.instances.enterpriseAgentService.exponential-backoff-multiplier=2

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.enterpriseAgentService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.enterpriseAgentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.enterpriseAgentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.enterpriseAgentService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.enterpriseAgentService.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.enterpriseAgentService.register-health-indicator=true
